# =============================================================================
# Swagger UI -> GitHub Pages
# -----------------------------------------------------------------------------
# Veröffentlicht die `openapi.yaml` aus `main` zusammen mit einer Swagger UI im
# ATVANTAGE-Stil. Über einen Umschalter lassen sich zusätzlich die Stände aller
# gemergten PRs aufrufen, die die `openapi.yaml` geändert haben. Die Swagger UI liegt nicht im Repository, sondern wird zur
# Build-Zeit in der gepinnten Version (SWAGGER_UI_VERSION) geladen. Die
# Oberfläche (Leiste, Theme, Logo) liegt in `pages/` neben diesem Workflow.
#
# Voraussetzung (einmalig): Settings -> Pages -> Source: "GitHub Actions".
# =============================================================================
name: Swagger UI

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  pages: write
  id-token: write

# Läuft ein Deploy, wartet der nächste – ein laufender wird nicht abgebrochen.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  SWAGGER_UI_VERSION: 5.32.15

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Vollständig, weil die Stände der gemergten PRs aus deren
          # Merge-Commits gelesen werden.
          fetch-depth: 0

      # Für den Umschalter: der aktuelle Stand aus `main` (vorausgewählt) und
      # dazu jeder gemergte PR, der `openapi.yaml` geändert hat – jeweils mit
      # der Fassung zum Zeitpunkt seines Merges. PRs, die nur Code betreffen,
      # tauchen nicht auf.
      - name: Stände einsammeln
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p site/specs
          cp openapi.yaml site/specs/main.yaml

          gh pr list --repo "$GITHUB_REPOSITORY" --state merged --base main --limit 500 \
            --json number,title,url,mergedAt,mergeCommit,files \
            --jq '[.[] | select(any(.files[]; .path == "openapi.yaml"))] | sort_by(.mergedAt) | reverse' \
            > prs.json

          : > entries.ndjson
          for number in $(jq -r '.[].number' prs.json); do
            sha=$(jq -r --argjson n "$number" '.[] | select(.number == $n) | .mergeCommit.oid' prs.json)
            if ! git cat-file -e "$sha:openapi.yaml" 2>/dev/null; then
              echo "::warning::PR #$number hat nach dem Merge keine openapi.yaml – übersprungen."
              continue
            fi
            git show "$sha:openapi.yaml" > "site/specs/pr-$number.yaml"
            jq -c --argjson n "$number" '.[] | select(.number == $n) | {
                id: "pr-\(.number)",
                label: "#\(.number) – \(.title)",
                summary: "Stand nach dem Merge von PR #\(.number): \(.title)",
                url: "specs/pr-\(.number).yaml",
                link: .url,
                linkText: "PR #\(.number)"
              }' prs.json >> entries.ndjson
          done

          # Pages liefert mit `max-age=600` aus. Die Fassungen der PRs ändern sich
          # nicht mehr, main aber mit jedem Deploy – der Commit in der URL sorgt
          # dafür, dass der Browser keine veraltete Fassung aus dem Cache zeigt.
          jq -s --arg repo "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" --arg sha "$GITHUB_SHA" '{specs: ([{
              id: "main",
              label: "Aktueller Stand (main)",
              summary: "Der aktuelle Stand auf main.",
              url: "specs/main.yaml?v=\($sha)",
              link: ($repo + "/blob/main/openapi.yaml"),
              linkText: "main"
            }] + .)}' entries.ndjson > site/specs.json
          cat site/specs.json

      - name: Swagger UI holen und Site zusammenstellen
        run: |
          set -euo pipefail
          mkdir -p site
          npm pack --silent --pack-destination /tmp "swagger-ui-dist@${SWAGGER_UI_VERSION}" > /tmp/tgz.txt
          tar -xzf "/tmp/$(cat /tmp/tgz.txt)" -C /tmp
          # Standalone-Preset und Favicons von swagger-ui-dist werden nicht
          # gebraucht: Leiste und Favicon kommen aus pages/.
          cp /tmp/package/swagger-ui.css \
             /tmp/package/swagger-ui-bundle.js \
             /tmp/package/oauth2-redirect.html \
             site/
          cp .github/workflows/pages/* site/
          cp openapi.yaml site/

      - name: Ergebnis prüfen
        run: |
          set -euo pipefail
          for f in index.html topbar.js swagger-theme.css swagger-ui.css swagger-ui-bundle.js openapi.yaml specs.json specs/main.yaml; do
            test -s "site/$f" || { echo "FEHLER: site/$f fehlt oder ist leer"; exit 1; }
          done
          echo "Site: $(find site -type f | wc -l) Dateien"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
